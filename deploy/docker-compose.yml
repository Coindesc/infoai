services:
  infoai-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: infoai_newspaper
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - "PORT=3000"
      - "NODE_ENV=production"
      - "EVOLUTION_API_URL=http://evolution-api:8080"
      - "EVOLUTION_API_KEY=InfoAI_Evolution_Key_2026_Secure"
      - "EVOLUTION_INSTANCE_NAME=venderapido-bot"
    env_file:
      - ../.env
    depends_on:
      - evolution-api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8082:8080"
    environment:
      - "SERVER_URL=http://localhost:8082"
      - "AUTHENTICATION_TYPE=apikey"
      - "AUTHENTICATION_API_KEY=InfoAI_Evolution_Key_2026_Secure"
      - "AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true"
      - "DATABASE_ENABLED=true"
      - "DATABASE_PROVIDER=postgresql"
      - "DATABASE_CONNECTION_URI=postgresql://evolution:evolution_pass_2026@evolution-postgres:5432/evolution_db?schema=public"
      - "DATABASE_SAVE_DATA_INSTANCE=true"
      - "DATABASE_SAVE_DATA_NEW_MESSAGE=true"
      - "DATABASE_SAVE_MESSAGE_UPDATE=true"
      - "DATABASE_SAVE_DATA_CONTACTS=true"
      - "CACHE_REDIS_ENABLED=true"
      - "CACHE_REDIS_URI=redis://:evolution_redis_2026@evolution-redis:6379"
      - "CACHE_REDIS_PREFIX_KEY=evolution-api"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    depends_on:
      - evolution-postgres
      - evolution-redis

  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_pass_2026
      POSTGRES_DB: evolution_db
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    command: redis-server --requirepass evolution_redis_2026
    volumes:
      - evolution_redisdata:/data

volumes:
  evolution_instances:
  evolution_store:
  evolution_pgdata:
  evolution_redisdata:
