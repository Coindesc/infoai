version: '3.8'

services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.1.1
    container_name: evolution_api
    restart: always
    ports:
      - "8082:8080"
    environment:
      - SERVER_URL=http://localhost:8082
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=InfoAI_Evolution_Key_2026_Secure
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_pass_2026@postgres:5432/evolution_db?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:evolution_redis_2026@redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution-api:
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_pass_2026
      POSTGRES_DB: evolution_db
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    command: redis-server --requirepass evolution_redis_2026
    volumes:
      - evolution_redisdata:/data

volumes:
  evolution_instances:
  evolution_store:
  evolution_pgdata:
  evolution_redisdata:
