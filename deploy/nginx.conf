# ==============================================================================
# CONFIGURAÇÃO NGINX: VIRTUAL HOST PARA VENDERAPIDO.COM.BR
# Copie para /etc/nginx/sites-available/venderapido e ative em /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    server_name venderapido.com.br www.venderapido.com.br;

    # Redirecionamento HTTP para HTTPS (ativar após emitir SSL com Certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache agressivo para assets estáticos (imagens, CSS e JS compilados)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2|woff)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Compressão Gzip para carregamento ultra-rápido global
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";
}

